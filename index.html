 <!-- ONE-TAP TRACKING SNIPPET (Total + Realtime Live Traffic) -->
<script>
  (function(){
    const supabaseUrl = "https://frbkoitcqjfbusdftkfr.supabase.co";
    const apiKey = "sb_publishable_pVCXinNUyr3a7TVNUhrD5w_AyytUEvi";
    const projectId = "6a82f725883885bad083e75e";

    // Unique session ID for each visitor tab
    let sessionId = sessionStorage.getItem('onetap_sid');
    if (!sessionId) {
      sessionId = Math.random().toString(36).substring(2, 12);
      sessionStorage.setItem('onetap_sid', sessionId);
    }

    function sendLog() {
      fetch(`${supabaseUrl}/rest/v1/traffic_logs`, {
        method: "POST",
        headers: {
          "apikey": apiKey,
          "Authorization": `Bearer ${apiKey}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          project_id: projectId, 
          url: window.location.href,
          referrer: document.referrer || sessionId // Session track karne ke liye
        }),
        keepalive: true
      }).catch(e => console.log("Tracking blocked"));
    }

    // Pehle load par view log karega
    sendLog();

    // Har 30 second me heartbeat ping
    setInterval(sendLog, 30000); 
  })();
</script>
