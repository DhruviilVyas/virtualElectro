<!-- ONE-TAP LIVE TRACKING (100% Serverless WebSockets) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function(){
    const supabaseUrl = "https://frbkoitcqjfbusdftkfr.supabase.co";
    const apiKey = "sb_publishable_pVCXinNUyr3a7TVNUhrD5w_AyytUEvi";
    const projectId = "6a82f725883885bad083e75e";

    // Supabase client initialize
    const supabaseClient = supabase.createClient(supabaseUrl, apiKey);

    // 1. Total Views count karne ke liye Database me log insert
    supabaseClient.from('traffic_logs').insert([{ 
      project_id: projectId, 
      url: window.location.href, 
      referrer: document.referrer 
    }]).then();

    // 2. LIVE TRAFFIC ke liye Supabase Presence (WebSockets)
    // Jaise hi user website kholega, wo is room me shamil ho jayega
    const liveRoom = supabaseClient.channel('live_' + projectId);
    
    liveRoom.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        // User ko "Online" mark kar do
        await liveRoom.track({ online_at: new Date().toISOString() });
      }
    });
  })();
</script>
